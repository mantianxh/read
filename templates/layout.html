<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{meta_description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{og_description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{SITE_NAME}}">
{{json_ld_block}}
<script>
/* 夜间模式防闪烁：在首帧渲染前按已保存的主题设置 <html class="dark"> */
(function () {
  try {
    var t = localStorage.getItem("reader:theme");
    if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/79/main/result.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/79/main/result.css"></noscript>
<link rel="stylesheet" href="/assets/style.min.css">
</head>
<body>
<noscript>
  <div class="noscript-warn">本阅读站的目录、图片灯箱、字号调节等功能依赖 JavaScript，请启用后再使用。</div>
</noscript>
<div id="progress" class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
<header class="site-header">
  <a class="brand" href="/index.html">{{SITE_NAME}}</a>
  <div class="header-tools">
    <button id="font-dec" class="tool-btn" title="减小字号" aria-label="减小字号">A−</button>
    <button id="font-inc" class="tool-btn" title="增大字号" aria-label="增大字号">A+</button>
    <button id="theme-toggle" class="tool-btn" title="切换主题" aria-label="切换主题">◐</button>
  </div>
</header>
<main class="container {{page_class}}">{{content}}</main>
<footer class="site-footer">
  <p>by mtxh</p>
</footer>
<div id="lightbox" class="lightbox" hidden>
  <button class="lightbox-btn lightbox-close" type="button" aria-label="关闭">×</button>
  <button class="lightbox-btn lightbox-prev" type="button" aria-label="上一张">‹</button>
  <img class="lightbox-main" alt="">
  <button class="lightbox-btn lightbox-next" type="button" aria-label="下一张">›</button>
</div>
<button id="back-top" class="fab fab-top" type="button" aria-label="返回顶部" hidden>↑</button>
<script src="/assets/reader.min.js"></script>
</body>
</html>
